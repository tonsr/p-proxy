name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # libssh2-sys 0.2.7 的 CMakeLists 用了 CMake 2.x 时代的 cmake_minimum_required，
  # CMake 4.x 会直接报错退出，因此 Windows / macOS 统一用 3.31.x。
  CMAKE_VER: "3.31.6"

jobs:
  # ---------------------------------------------------------------------------
  # Linux: gnu 目标，OpenSSL 来自 cross 镜像内的系统包
  # （musl 静态方案被 libssh2-sys 的 CMake 限制在 sysroot 内搜索，走不通）
  # ---------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            openssl: system
          - target: aarch64-unknown-linux-gnu
            openssl: custom
          - target: armv7-unknown-linux-gnueabihf
            openssl: custom
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          set -eux
          if [ "${{ matrix.openssl }}" = "custom" ]; then
            # pre-build 已在容器内编好 OpenSSL 到 /usr/local/openssl
            OPENSSL_DIR=/usr/local/openssl OPENSSL_STATIC=1 \
              cross build --release --locked --target ${{ matrix.target }}
          else
            cross build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          set -eux
          NAME="p-proxy-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/p-proxy" "dist/${NAME}/"
          cp config.example.yaml README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: x86_64-pc-windows-gnu，链接 msys2 的静态 OpenSSL
  # ---------------------------------------------------------------------------
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-openssl mingw-w64-x86_64-pkgconf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install CMake 3.x
        shell: pwsh
        run: |
          $url = "https://github.com/Kitware/CMake/releases/download/v$env:CMAKE_VER/cmake-$env:CMAKE_VER-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\cmake" -Recurse -Filter cmake.exe | Select-Object -First 1
          Split-Path $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $env:OPENSSL_DIR = "C:\msys64\mingw64"
          $env:OPENSSL_STATIC = "1"
          # libssh2 1.9 的 wincng 后端在 MinGW 下会把 _libssh2_wincng 定义进多个目标文件，
          # 触发 multiple definition；该符号内容一致，允许重复定义即可。
          $env:RUSTFLAGS = "-C link-arg=-Wl,--allow-multiple-definition"
          cmake --version
          cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Package
        shell: bash
        run: |
          set -eux
          NAME="p-proxy-x86_64-pc-windows-gnu"
          mkdir -p "dist/${NAME}"
          cp "target/x86_64-pc-windows-gnu/release/p-proxy.exe" "dist/${NAME}/"
          cp config.example.yaml README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: Intel 与 Apple Silicon 各一份
  # ---------------------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL
        run: |
          set -eux
          brew install openssl@3 || brew upgrade openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Install CMake 3.x
        run: |
          set -eux
          TARBALL="cmake-${CMAKE_VER}-macos-universal.tar.gz"
          curl -fsSL -o "/tmp/${TARBALL}" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/${TARBALL}"
          mkdir -p /tmp/cmake3
          tar -xzf "/tmp/${TARBALL}" -C /tmp/cmake3 --strip-components=1
          echo "/tmp/cmake3/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          cmake --version
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eux
          NAME="p-proxy-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/p-proxy" "dist/${NAME}/"
          cp config.example.yaml README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总所有产物，挂到 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
