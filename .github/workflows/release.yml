name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Linux: 静态 musl，x86_64 / aarch64 / armv7
  # OpenSSL 通过 vendored feature 从源码编译，产物不依赖目标机 libssl。
  # ---------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --features vendored-openssl --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eux
          NAME="p-proxy-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/p-proxy" "dist/${NAME}/"
          cp config.example.yaml README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: x86_64-pc-windows-gnu，链接 msys2 的静态 OpenSSL
  # ---------------------------------------------------------------------------
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-openssl mingw-w64-x86_64-pkgconf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $env:OPENSSL_DIR = "C:\msys64\mingw64"
          $env:OPENSSL_STATIC = "1"
          cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Package
        shell: bash
        run: |
          set -eux
          NAME="p-proxy-x86_64-pc-windows-gnu"
          mkdir -p "dist/${NAME}"
          cp "target/x86_64-pc-windows-gnu/release/p-proxy.exe" "dist/${NAME}/"
          cp config.example.yaml README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: Intel 与 Apple Silicon 各出一份
  # ---------------------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL
        run: |
          set -eux
          brew install openssl@3 || brew upgrade openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eux
          NAME="p-proxy-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/p-proxy" "dist/${NAME}/"
          cp config.example.yaml README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ls -lh "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总所有产物，挂到 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
