[package]
name = "p-proxy"
version = "0.1.0"
edition = "2024"

# 开发构建：适度优化以降低启动期内存峰值（debug 默认 opt-level=0 易导致 500MB+ 峰值）
[profile.dev]
opt-level = 1

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "p-proxy"
path = "src/main.rs"
# [[bin]]
# name = "p-test"
# path = "test.rs"

# CI 交叉编译到 musl / arm / android 时启用：
#   cargo build --release --features vendored-openssl
# 让 OpenSSL 从源码编译到目标架构，不依赖目标平台的 libssl。
# 本地常规构建不要开，行为与之前一致。
[features]
default = []
vendored-openssl = ["openssl-sys/vendored"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-tungstenite = "0.14"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
urlencoding = "2"
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs", "logging"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
ssh2 = "0.3"
# 仅用于让 libssh2-sys 链接到的 openssl-sys 能走 vendored（feature unification）；
# 默认不启用以避免引入额外的编译时间。
openssl-sys = { version = "0.9", optional = true }

hex = "0.4"
once_cell = "1.19"