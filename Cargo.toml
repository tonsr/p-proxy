[package]
name = "p-proxy"
version = "0.2.1"
edition = "2024"
authors = ["tonsr <https://github.com/tonsr>"]
description = "IntraHub: single-entry intranet aggregation proxy. One config, many isolated networks, WebSocket cross-network tunnels."
license = "MIT"
repository = "https://github.com/tonsr/p-proxy"
readme = "README.md"

# 开发构建：适度优化以降低启动期内存峰值（debug 默认 opt-level=0 易导致 500MB+ 峰值）
[profile.dev]
opt-level = 1

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "p-proxy"
path = "src/main.rs"
# [[bin]]
# name = "p-test"
# path = "test.rs"

# webssh 默认开启：内置浏览器 SSH 终端（依赖 ssh2 -> libssh2 -> OpenSSL）。
# 交叉编译到无法提供 OpenSSL 的目标（如 Android/NDK）时用 --no-default-features 去掉它，
# 此时代理、分流、TCP 隧道、Web UI 等能力完全不受影响。
[features]
default = ["webssh"]
webssh = ["dep:ssh2"]
vendored-openssl = ["openssl-sys/vendored"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-tungstenite = "0.14"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
urlencoding = "2"
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs", "logging"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
ssh2 = { version = "0.3", optional = true }
# 仅用于让 libssh2-sys 链接到的 openssl-sys 能走 vendored（feature unification）；
# 默认不启用以避免引入额外的编译时间。
openssl-sys = { version = "0.9", optional = true }

hex = "0.4"
once_cell = "1.19"