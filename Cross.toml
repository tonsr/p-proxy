# cross 交叉编译配置：https://github.com/cross-rs/cross
#
# p-proxy 通过 ssh2 -> libssh2-sys 0.2.7 间接依赖 OpenSSL：
#  - x86_64 gnu：直接使用 cross 镜像内预装的 libssl-dev
#  - aarch64 / armv7：cross 镜像装不上目标架构的 libssl-dev，因此在 pre-build 里
#    用镜像自带的交叉工具链为 arm 架构现场编译一份 OpenSSL，安装到 /usr/local/openssl，
#    构建时通过 OPENSSL_DIR 指过去（见 workflow 的 matrix.openssl）。
#
# 用法：
#   cross build --release --locked --target <target>

[build.env]
passthrough = ["OPENSSL_DIR", "OPENSSL_STATIC", "OPENSSL_LIB_DIR", "OPENSSL_INCLUDE_DIR"]

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
pre-build = [
    "apt-get update -y || true && apt-get install -y --no-install-recommends pkg-config libssl-dev || true",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "set -eux; apt-get update -y; apt-get install -y --no-install-recommends perl make curl ca-certificates; cd /tmp; curl -fsSL -o o.tgz https://github.com/openssl/openssl/releases/download/openssl-3.0.16/openssl-3.0.16.tar.gz; tar xzf o.tgz; cd openssl-3.0.16; ./Configure linux-aarch64 --cross-compile-prefix=aarch64-linux-gnu- no-shared no-tests no-asm --prefix=/usr/local/openssl --libdir=lib; make -j4; make install_sw",
]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"
pre-build = [
    "set -eux; apt-get update -y; apt-get install -y --no-install-recommends perl make curl ca-certificates; cd /tmp; curl -fsSL -o o.tgz https://github.com/openssl/openssl/releases/download/openssl-3.0.16/openssl-3.0.16.tar.gz; tar xzf o.tgz; cd openssl-3.0.16; ./Configure linux-armv4 --cross-compile-prefix=arm-linux-gnueabihf- no-shared no-tests no-asm --prefix=/usr/local/openssl --libdir=lib; make -j4; make install_sw",
]
